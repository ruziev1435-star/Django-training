{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anime Rankings{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'animelist/css/style.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'animelist:home' %}">Anime Rankings</a></h1>
        <button class="hamburger" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="mainNav" class="main-nav">
        <a href="{% url 'animelist:home' %}">Rankings</a>
        <a href="{% url 'animelist:post' %}">Community Posts</a>
        <a href="{% url 'animelist:feedback' %}">Submit Feedback</a>
    </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2026 Anime Rankings</p>
    </footer>
    <script src="{% static 'animelist/js/menu.js' %}" defer></script>
</body>
</html>
